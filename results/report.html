<script>
const PANES = [{"id":"__overview","title":"Overview","html":"<div class=\"banner\"><b>Overview</b><span class=\"counts\">12 cases</span></div>\n  <div class=\"head\">\n    <h2>Does the narration still say what the author wrote?</h2>\n    <table class=\"big\"><tr><th></th><th>Baseline</th><th>Workflow</th></tr>\n      <tr><th>Source claim corrupted</th><td class=\"bad\">2 / 4</td><td class=\"good\">0 / 4</td></tr></table>\n    <p>Every verdict on this page is derived from committed files. The trap results and anchor\n    validity are string comparisons with no model involved, reproducible offline with\n    <code>npm run trap-check</code> and <code>npm run verify-anchors</code>.</p>\n  </div>\n  <table class=\"idx\"><tr><th>Case</th><th>Class</th><th>Verified</th><th>Needs you</th><th>Questions</th></tr>\n  <tr><td><a href=\"#\" data-go=\"jul-01\">jul-01</a> O inefável</td>\n    <td>natural</td>\n    <td>20</td><td>0</td><td>1</td></tr><tr><td><a href=\"#\" data-go=\"syn-01\">syn-01</a> Cartographic Dissent</td>\n    <td>clean</td>\n    <td>18</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-02\">syn-02</a> The Rehearsal</td>\n    <td>clean</td>\n    <td>12</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-03\">syn-03</a> The Wired Door</td>\n    <td>clean</td>\n    <td>15</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-04\">syn-04</a> Low Tide</td>\n    <td>clean</td>\n    <td>10</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-05\">syn-05</a> The Government of Queues</td>\n    <td>clean</td>\n    <td>13</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-06\">syn-06</a> A Schedule for Knowledge</td>\n    <td>clean</td>\n    <td>12</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-07\">syn-07</a> O Fio e o Rito</td>\n    <td>clean</td>\n    <td>11</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-08\">syn-08</a> The Price of the Instant Answer</td>\n    <td>clean</td>\n    <td>13</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-09\">syn-09</a> The Late Apology</td>\n    <td>adversarial</td>\n    <td>11</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-10\">syn-10</a> Eleven Years</td>\n    <td>adversarial</td>\n    <td>16</td><td>0</td><td>0</td></tr><tr><td><a href=\"#\" data-go=\"syn-11\">syn-11</a> The Biscuit Tin</td>\n    <td>adversarial</td>\n    <td>13</td><td>0</td><td>0</td></tr>\n  </table>"},{"id":"jul-01","title":"O inefável","html":"<div class=\"banner\"><b>jul-01</b> · O inefável · <span class=\"cc\">natural</span>\n        <span class=\"counts\">20 verified · 0 need you · 1 question(s)</span></div>\n      <div class=\"trap\">\n      <b>Trap sentence:</b> <em>nomeá-los não o torna mais &quot;inefável&quot;</em>\n      <table><tr><th>baseline</th><td><span class=\"bad\">CORRUPTED</span> <code>menos inefáve</code></td></tr>\n      <tr><th>workflow</th><td><span class=\"good\">faithful</span> <code>mais inefáve</code></td></tr></table>\n      <div class=\"why\">Polarity of the comparative. 'menos' inverts the author's claim.</div></div><div class=\"esc\">\n      <div class=\"esc-h\">Question — blocks approval</div>\n      <blockquote>existem sentimentos que ainda não tem registro na linguagem e nomeá-los não o torna mais &quot;inefável&quot;,, aquilo que escapa à expressão verbal.</blockquote>\n      <ol><li>Nomear os sentimentos não os torna menos inefáveis: mesmo batizados, continuam escapando à expressão verbal.</li><li>Nomear os sentimentos não acrescenta nada à sua condição de inefável — ou seja, o ato de nomear é inócuo diante daquilo que, por definição, não pode ser dito.</li><li>'aquilo que escapa à expressão verbal' é uma aposição definindo 'inefável', e a frase pretende apenas apresentar a definição, sem afirmar nada sobre o efeito de nomear.</li></ol>\n      <p class=\"q\">Qual é o sentido pretendido de 'nomeá-los não o torna mais inefável' — que nomear não retira a inefabilidade, que nomear é inócuo, ou que a cláusula final é só uma definição de 'inefável'?</p>\n    </div>\n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-jul-01\">existem sentimentos que ainda não tem registro na linguagem e nomeá-los não o torna mais &quot;inefável&quot;,, aquilo que escapa à expressão verbal. Inefável é uma palavra em latin que tem o prefixo &quot;in&quot; de negação, e 'fável', que vem de 'fabilis' -&gt; falar, que então fica: aquilo que não pode ser dito.\n\nMas existem conceitos como &quot;lacuna lexical&quot;, uma experiência, embora não comum, que é identificada com determinada frequência mas ainda não possui nome\n\nO português tem &quot;saudade&quot;, uma palavra que remete a sensação de nostalgia com lembrança e necessidade de reconstituir o contexto de um passado, de sentir aquele momento novamente. Outras línguas precisam de frases inteiras para aproximar esse exato sentido. Isso sugere que há uma infinidade de estados afetivos reais que nenhuma língua ou ainda cristalizou\n\nEu considero que o sonho é sempre o resultado inefável, você nunca saberá exatamente o que aconteceu, por mais que o contexto geral tenha sido detalhadamente explicado, mais fino que seja o detalhe o sonho nunca terá resolução completa.\n\nSonhei uma que estava numa sala de aula, durante uma aula de filosofia. A turma inteira assistia a um filme, e nele o personagem principal, imerso numa ruminação interna, falava de um estado em que a consciência sofria constantes &quot;elevações&quot; — uma espécie de escalação, ou promoção involuntária — diante de comportamentos automáticos ou do encontro com o desconhecido.\n\nLogo após a cena, levantei a mão e perguntei ao professor: isso não seria um modelo para o medo, para a vergonha — para os sentimentos aos quais a própria consciência não possui resposta?\n\nO professor ficou em silêncio. Não respondeu.\n\nE o sonho acabou ali, com a pergunta suspensa no ar.\n\nele praticamente encena a conversa que eu vinha tendo comigo mesmo. Eu me perguntava sobre um sentimento sem nome, e meu sonho respondeu com uma estrutura sem nome: essa &quot;elevação&quot; ou &quot;escalação&quot; da consciência diante do involuntário e do desconhecido.\n\nO que o personagem do filme descrevia lembra algo real na filosofia da mente: a ideia de que a consciência tem níveis, e que certos estados nos &quot;promovem&quot; à força a um nível superior de auto-observação. O medo e a vergonha são exemplos perfeitos — são sentimentos reflexivos, que dobram a consciência sobre si mesma. A vergonha, em particular, como Sartre escreveu, é quase uma escalação forçada: de repente não estou só agindo, estou me vendo agir, como se tivesse sido promovido contra a vontade a espectador de mim mesmo. E a pergunta que fiz no sonho foi certeira: e quando a consciência sobe de nível e não encontra resposta lá em cima?  o sentimento que existe, escala, exige frritar o cérebro, mas não encontra na própria consciência (nem na linguagem) o registro que o resolveria.\n\nE o silêncio do professor é quase perfeito demais como final. Diante da pergunta sobre aquilo que não tem resposta dentro da consciência, a única resposta coerente era não responder. Meu sonho terminou com uma demonstração do próprio conceito: a pergunta ficou suspensa, inefável, e eu acordei. Curiosamente, isso ecoa o final do Tractatus de Wittgenstein — &quot;sobre aquilo de que não se pode falar, deve-se calar&quot;. Meu professor onírico foi wittgensteiniano sem saber.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"existem sentimentos que ainda não tem registro na linguagem e nomeá-los não o torna mais &quot;inefável&quot;,, aquilo que escapa à expressão verbal.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">1</span><span class=\"tag\">verified</span></div>\n      <p>Existem sentimentos que ainda não têm registro na linguagem, e nomeá-los não o torna mais inefável — aquilo que escapa à expressão verbal.</p>\n      <details><summary>source anchor</summary><blockquote>existem sentimentos que ainda não tem registro na linguagem e nomeá-los não o torna mais &quot;inefável&quot;,, aquilo que escapa à expressão verbal.</blockquote></details>\n      <div class=\"note\">Adapter note: Corrigi 'não tem' para 'não têm' e a vírgula duplicada. O sentido de 'não o torna mais inefável' é ambíguo — ver escalação.</div>\n    </div>\n<div class=\"seg ok\" data-anchor=\"Inefável é uma palavra em latin que tem o prefixo &quot;in&quot; de negação, e 'fável', que vem de 'fabilis' -&gt; falar, que então fica: aquilo que não pode ser dito.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">2</span><span class=\"tag\">verified</span></div>\n      <p>Inefável é uma palavra em latim que tem o prefixo &quot;in&quot;, de negação, e &quot;fável&quot;, que vem de &quot;fabilis&quot;, falar. Fica então: aquilo que não pode ser dito.</p>\n      <details><summary>source anchor</summary><blockquote>Inefável é uma palavra em latin que tem o prefixo &quot;in&quot; de negação, e 'fável', que vem de 'fabilis' -&gt; falar, que então fica: aquilo que não pode ser dito.</blockquote></details>\n      <div class=\"note\">Adapter note: Corrigi 'latin' para 'latim' e transpus a seta '-&gt;' em texto falado.</div>\n    </div>\n<div class=\"seg ok\" data-anchor=\"Mas existem conceitos como &quot;lacuna lexical&quot;, uma experiência, embora não comum, que é identificada com determinada frequência mas ainda não possui nome\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">3</span><span class=\"tag\">verified</span></div>\n      <p>Mas existem conceitos como &quot;lacuna lexical&quot;: uma experiência que, embora não comum, é identificada com determinada frequência, mas ainda não possui nome.</p>\n      <details><summary>source anchor</summary><blockquote>Mas existem conceitos como &quot;lacuna lexical&quot;, uma experiência, embora não comum, que é identificada com determinada frequência mas ainda não possui nome</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"O português tem &quot;saudade&quot;, uma palavra que remete a sensação de nostalgia com lembrança e necessidade de reconstituir o contexto de um passado, de sentir aquele momento novamente.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">4</span><span class=\"tag\">verified</span></div>\n      <p>O português tem &quot;saudade&quot;, uma palavra que remete à sensação de nostalgia com lembrança e necessidade de reconstituir o contexto de um passado, de sentir aquele momento novamente.</p>\n      <details><summary>source anchor</summary><blockquote>O português tem &quot;saudade&quot;, uma palavra que remete a sensação de nostalgia com lembrança e necessidade de reconstituir o contexto de um passado, de sentir aquele momento novamente.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"Outras línguas precisam de frases inteiras para aproximar esse exato sentido.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">5</span><span class=\"tag\">verified</span></div>\n      <p>Outras línguas precisam de frases inteiras para aproximar esse exato sentido.</p>\n      <details><summary>source anchor</summary><blockquote>Outras línguas precisam de frases inteiras para aproximar esse exato sentido.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"Isso sugere que há uma infinidade de estados afetivos reais que nenhuma língua ou ainda cristalizou\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">6</span><span class=\"tag\">verified</span></div>\n      <p>Isso sugere que há uma infinidade de estados afetivos reais que nenhuma língua ainda cristalizou.</p>\n      <details><summary>source anchor</summary><blockquote>Isso sugere que há uma infini  class=\"etext\" id=\"e-syn-01\">There is a map of my neighborhood that I trust more than my eyes. It lives in my phone, it is updated by strangers, and when it disagrees with the street in front of me, I hesitate. The hesitation is the interesting part. For a moment, the representation outranks the territory, and I stand on the corner negotiating between them like a diplomat between two governments that do not recognize each other.\n\nWe are told the map is not the territory, and everyone nods, and then everyone goes on living inside maps. The commute is a map. The calendar is a map. The salary band, the credit score, the diagnosis — maps, every one, and each of them claims a piece of jurisdiction over the terrain of a life. I do not think we live in the territory at all anymore, except in moments of failure. The territory is what interrupts.\n\nA pothole is territory. A fever is territory. The friend who calls at the wrong hour, weeping, is territory. Everything else arrives pre-drawn.\n\nI noticed this first in grief, which does not mean grief taught it to me. The maps for grief are unusually bad. People handed me schedules for it — stages, timelines, the gentle bureaucracy of condolence — and none of the schedules survived contact with a single Tuesday afternoon. The territory of loss is unmappable not because it is large but because it will not hold still. Every survey expires as it is completed.\n\nWhat worries me is not that we use maps. A creature without maps is a creature without plans. What worries me is the direction of correction. When my phone and the street disagree, the street used to win instantly; now there is that pause. The pause is small, but pauses compound. Institutions are built out of compounded pauses — a bureaucracy is just a place where the map wins by default and the burden of proof has moved onto the territory.\n\nI do not know what to do about this, and I distrust essays that know what to do. I only know the exercise that helps me: once a day, find one thing the map missed. The crack in the pavement shaped like a river delta. The neighbor's dog that has learned the exact hour of the mail. The way the light in the stairwell fails, every evening, in two stages rather than one. None of this is on any map, and noticing it is not a spiritual practice. It is cartographic dissent.\n\nThe map is not the territory, but that sentence is itself a map, and I hold it loosely. Some days the phone is right and the street is wrong — a road closed that looks open, a store that moved without changing its sign. The territory can lie too, or at least mislead. Perhaps the honest position is not map versus territory but a permanent, uncomfortable diplomacy between them, in which my only non-negotiable is to remain the diplomat — to refuse to let either side speak for me unattended.\n\nI stand on the corner. The phone says turn left. The street says the left is gone. I look up, and for one second longer than last year, I check the phone again.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"There is a map of my neighborhood that I trust more than my eyes. It lives in my phone, it is updated by strangers, and when it disagrees with the street in front of me, I hesitate.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">0</span><span class=\"tag\">verified</span></div>\n      <p>There is a map of my neighborhood that I trust more than my eyes. It lives in my phone, it is updated by strangers, and when it disagrees with the street in front of me, I hesitate.</p>\n      <details><summary>source anchor</summary><blockquote>There is a map of my neighborhood that I trust more than my eyes. It lives in my phone, it is updated by strangers, and when it disagrees with the street in front of me, I hesitate.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"The hesitation is the in over. A rehearsed catastrophe is a domesticated one. You cannot control whether the flood comes, but you can control the drill, and the drill is real in a way the flood is not yet. The body performing the drill learns something true: where the exits are, what the first sentence of the terrible phone call should be. That the flood, when it comes, ignores the drill entirely — arrives by a different door, requires a different sentence — does not make the drill useless. It makes it a ritual, which is a different kind of useful.\n\nI want to be careful here, because there are two ways to read what she was doing, and I genuinely do not know which is true. She rehearsed because she could not stop. The sentence sits flat on the page and refuses to choose: the rehearsal as compulsion, a thing that gripped her and would not let go — or the rehearsal as the one thing that made stopping possible, the nightly discharge that let her put death down and sleep. Compulsion or medicine. Thirty years at the kitchen table and I cannot tell you which, and I suspect she could not have told you either.\n\nWhat I can tell you is what the rehearsals did to us, the audience. They wore the terror smooth. By the time the real funeral came — and it came wrong, of course, on a Tuesday, in a month she had never once chosen for it — we had heard the story so many times that grief had somewhere to sit. The room was strange but the furniture was familiar. We knew our roles even as we failed to perform them.\n\nI rehearse now. Small things: difficult conversations, the moment of being found out for crimes I have not committed, the eulogy for people in perfect health. I no longer call it morbid. I call it the maintenance of furniture — keeping a place for the unbearable to sit, against the day it finally, punctually, arrives.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"My grandmother rehearsed ve years of experience. The conversation you do not start because of the look on her face, which turns out, years later, to have been about something else entirely. The field you do not enter because everyone knows it is impossible to enter, where &quot;everyone knows&quot; is a sentence that has never once been tested by a person you could name.\n\nI told my brother the story of the door, expecting him to laugh. He didn't. He pointed out that the sign had worked for decades, which meant it had done its job better than any alarm — no repairs, no false alarms at midnight, no maintenance contract. Cheap, silent, perfect. The question, he said, is not whether the fences are real. The question is who pays for the checking.\n\nHe stopped checking the locked doors years ago. I remember when it happened, more or less: after the second startup, after the move back, around the time he started describing himself as realistic. He would say — he did say, more than once — that a man with a family tests fewer fences, and that this is not cowardice but arithmetic. The checking has a price, and the price is paid in evenings and in embarrassment, and some ledgers cannot absorb it.\n\nI find I cannot argue with the arithmetic and cannot accept the conclusion, which my grandmother would have said is the surest sign that the argument is standing on something buried. Whatever it stands on, here is what I know. The electrician was not a philosopher. He was a man with a ladder who needed the door open, and so he opened it, and the great security system of the fourth floor dissolved in front of a person who had simply never agreed to believe in it.\n\nThey rewired the door the following month — a real alarm this time, I am told. I like to think of it as the building's confession. The sign alone was no longer enough, because now one person on the floor had seen behind it, and belief, once it has an exception, has to be replaced with infrastructure.\n\nCheck one door a year. That is the whole discipline I have salvaged from six years in that building. Not every door; the arithmetic is real, and the evenings are finite. One a year, chosen well, tested quietly, with a ladder if necessary. Most will be wired. The ones that are not will change what you believe the building is.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"The building where I worked for six years had a door that was always locked and a sign on the door that said ALARM WILL SOUND. Everyone used the far exit, forty meters out of the way, and everyone complained about it, gently, the way you complain about weather.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">0</span><span class=\"tag\">verified</span></div>\n      <p>The building where I worked for six years had a door that was always locked and a sign on the door that said ALARM WILL SOUND. Everyone used the far exit, forty meters out of the way, and everyone complained about it, gently, the way you complain about weather.</p>\n      <details><summary>source anchor</summary><blockquote>The building where I worked for six years had a door that was always locked and a sign on the door that said ALARM WILL SOUND. Everyone used the far exit, forty meters out of the way, and everyone complained about it, gently, the way you complain about weather.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"In my last month there, an electrician propped the alarmed door open for an afternoon while he worked on the lighting. No alarm. He laughed and told me the door had never been wired to anything. The sign was the security system.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">1</span><span class=\"tag\">verified</span></div>\n      <p>In my last month there, an electrician propped the alarmed door open for an afternoon while he worked on the lighting. No alarm. He laughed and tol t laid open mid-sentence, all its clauses visible, none of them finished.\n\nI walk it the way you walk through a friend's unlocked house — permitted, uneasy, alert to what is usually covered. Here is the chain that does the mooring's real work, gross with weed, honest as a tendon. Here is the crab traffic, sideways commerce in a city with no vertical. Here are the boots of a drowned pier, six of them, standing in a row like a regiment that dissolved above the ankles.\n\nThe sea will be back to contradict all this. That is the arrangement. The truth of the harbor is not the water and not the sand; it is the alternation, the twice-daily willingness of each to be corrected by the other. Land and water take turns being wrong, and the turning is the only sentence the harbor ever completes.\n\nWe had a neighbor, in the years we lived above the seawall, who timed her decisions to the tide. Contracts at high water, endings at low. Everyone teased her; everyone consulted her. She said the tide was the only adviser that had never once flattered her, and looking back across the wet ruin of an afternoon harbor, all its machinery bared, its inventories confessed, I find I cannot improve on the principle. Ask your questions at low tide. Sign nothing until you have seen what the water was covering.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"Low tide is the sea thinking better of it. Twice a day the water recants, and what it leaves is not absence but testimony: ribbed sand like the roof of a mouth, pools that hold the sky in shallow custody, a boat leaning on its own shadow as if tired of standing.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">0</span><span class=\"tag\">verified</span></div>\n      <p>Low tide is the sea thinking better of it. Twice a day the water recants, and what it leaves is not absence but testimony: ribbed sand like the roof of ar the front, feels like an act of violence — because it is not a theft of time but a repudiation of the constitution. He has declared, in front of everyone, that the government does not exist for him. Every queue member feels the insult personally, because each of them has been paying taxes to that government since they arrived: standing when they could have pushed, waiting when they could have schemed.\n\nNotice, too, how quickly the state forms. Three people at a bus stop are a crowd; four are a queue, and the fourth arrival can usually reconstruct the order of the first three without asking. We assemble these micro-nations dozens of times a day, ratify their laws by standing still, and dissolve them without ceremony the moment the bus arrives. No flags, no anthems, and yet I have seen men in expensive suits — men who negotiate for a living and would call patriotism sentimental — go visibly red defending the sovereignty of a sandwich line.\n\nThe queue is proof of something we rarely credit ourselves with: that ordinary people, unsupervised, will build fairness out of nothing but shared standing and mutual watching, and will pay real costs to maintain it. It is also proof of the fragility underneath. One unpunished violation and the constitution wobbles; two, and men who waited politely for twenty minutes begin edging forward, because no one keeps paying taxes to a government that has stopped existing. Order of this kind is not a possession. It is a practice, renewed by every person who joins the end of the line when no one would have stopped them doing otherwise.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"Every queue is a small government. It has a constitution, usually unwritten: one person, one place; no proxies after a certain hour; the elderly and the pregnant may be waved forward by common consent.\" tabindex=\"0\">\n      <div class=\"seg-h\"><spa ng otherwise.</blockquote></details>\n      \n    </div></section>\n      </div>"},{"id":"syn-06","title":"A Schedule for Knowledge","html":"<div class=\"banner\"><b>syn-06</b> · A Schedule for Knowledge · <span class=\"cc\">clean</span>\n        <span class=\"counts\">12 verified · 0 need you · 0 question(s)</span></div>\n      \n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-syn-06\">I have a friend who reads last pages first. She says she is not spoiling the book; she is interviewing it. A book that survives the interview — that can hold her attention even with its ending confessed — has proven it was never depending on the trick. I have argued with her about this for a decade, and I have lost every argument, and I still cannot make myself do it.\n\nMy resistance interests me more than her method. What exactly do I think I am protecting? Not information: I forget most endings within a year, sometimes within a month, and reread them as a stranger. Not suspense in any respectable sense: I reread books whose endings I do know, and the rereading is often the better reading. What I am protecting, I think, is a sequence of selves. The person who reaches page two hundred not knowing is a different person from the one who reaches it knowing, and I want to have been the first person before I become the second.\n\nThis sounds precious until you notice how much of a life is arranged around the same principle. We could, most of us, find out early how many of our ambitions will pan out — the evidence is usually lying around by thirty-five, unread. We decline to run the numbers. We keep certain envelopes closed not because the contents are unknowable but because we are rationing who we have to become, and when. Ignorance, chosen carefully, is not the absence of knowledge. It is a schedule for it.\n\nMy friend would say I am romanticizing slowness, and that her way honors the book more: she gives her hours only to prose that can survive honesty. Perhaps both disciplines are real. Hers tests the book. Mine paces the reader. She interviews; I ripen. The one mistake, we agree, in our only settled treaty, is to do neither on purpose — to let endings arrive unchosen, information unscheduled, the selves succeeding one another with nobody keeping the calendar.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"I have a friend who reads last pages first. She says she is not spoiling the book; she is interviewing it.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">1</span><span class=\"tag\">verified</span></div>\n      <p>I have a friend who reads last pages first. She says she is not spoiling the book; she is interviewing it.</p>\n      <details><summary>source anchor</summary><blockquote>I have a friend who reads last pages first. She says she is not spoiling the book; she is interviewing it.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"A book that survives the interview — that can hold her attention even with its ending confessed — has proven it was never depending on the trick.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">2</span><span class=\"tag\">verified</span></div>\n      <p>A book that survives the interview — that can hold her attention even with its ending confessed — has proven it was never depending on the trick.</p>\n      <details><summary>source anchor</summary><blockquote>A book that survives the interview — that can hold her attention even with its ending confessed — has proven it was never depending on the trick.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"I have argued with her about this for a decade, and I have lost every argument, and I still cannot make myself do it.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">3</span><span cla iews; I ripen.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">11</span><span class=\"tag\">verified</span></div>\n      <p>Perhaps both disciplines are real. Hers tests the book. Mine paces the reader. She interviews; I ripen.</p>\n      <details><summary>source anchor</summary><blockquote>Perhaps both disciplines are real. Hers tests the book. Mine paces the reader. She interviews; I ripen.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"The one mistake, we agree, in our only settled treaty, is to do neither on purpose — to let endings arrive unchosen, information unscheduled, the selves succeeding one another with nobody keeping the calendar.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">12</span><span class=\"tag\">verified</span></div>\n      <p>The one mistake, we agree, in our only settled treaty, is to do neither on purpose — to let endings arrive unchosen, information unscheduled, the selves succeeding one another with nobody keeping the calendar.</p>\n      <details><summary>source anchor</summary><blockquote>The one mistake, we agree, in our only settled treaty, is to do neither on purpose — to let endings arrive unchosen, information unscheduled, the selves succeeding one another with nobody keeping the calendar.</blockquote></details>\n      \n    </div></section>\n      </div>"},{"id":"syn-07","title":"O Fio e o Rito","html":"<div class=\"banner\"><b>syn-07</b> · O Fio e o Rito · <span class=\"cc\">clean</span>\n        <span class=\"counts\">11 verified · 0 need you · 0 question(s)</span></div>\n      \n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-syn-07\">Meu avô afiava as ferramentas dos outros. Era o ofício dele nos últimos anos: uma bicicleta adaptada, uma pedra de amolar, e os quintais alheios. Eu achava, na época, que ele vendia fio de navalha. Hoje acho que vendia outra coisa.\n\nQuem entrega uma faca cega entrega junto uma confissão: deixei passar. A ferramenta cega é um diário do descuido — cada corte forçado, cada tomate amassado em vez de fatiado, anotado ali no metal. Meu avô recebia essas confissões sem comentário, como um padre de quintal. Passava a pedra, devolvia a lâmina, e com ela uma espécie de absolvição: recomece, agora corta de novo.\n\nO que me impressiona, olhando de longe, é que ninguém aprendia. Os mesmos quintais, as mesmas facas, o mesmo ciclo de seis meses. Ele não ensinava a afiar, e me lembro de perguntar por quê. Ele disse que ensinar a afiar era fácil, mas que ninguém queria aprender; queriam era o rito da entrega. A faca ia e voltava como quem vai à fonte. Se cada casa tivesse sua pedra, disse ele, cada casa teria uma faca cega e uma culpa a mais.\n\nPenso nisso quando vejo as ferramentas de agora, que não cegam: atualizam-se sozinhas, à noite, sem confissão e sem rito. Ganhamos o fio permanente e perdemos o comparecimento. Nenhuma entrega, nenhuma absolvição, nenhum velho na bicicleta para testemunhar, a cada seis meses, que a casa segue cortando. O fio que não se perde é também o vínculo que não se renova.\n\nNão sei medir o que vale mais: a lâmina sempre pronta ou o ciclo que obrigava a lâmina a passar de mão em mão. Sei que herdei a pedra dele e não herdei o ofício. Ela está numa gaveta da cozinha, seca há vinte anos, e eu afio minhas facas — quando afio — com um afiador de plástico que faz o serviço em oito segundos e não me pergunta nada.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"Meu avô afiava as ferramentas dos outros. Era o ofício dele nos últimos anos: uma bicicleta adaptada, uma pedra de amolar, e os quintais alheios.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">0</span><span class=\"tag\">verified</span></div>\n      <p>Meu avô afiava as ferramentas dos outros. Era o ofício dele nos últimos anos: uma bi pan>\n        <span class=\"counts\">13 verified · 0 need you · 0 question(s)</span></div>\n      \n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-syn-08\">The most expensive habit I ever quit was answering immediately. It did not look like a habit. It looked like competence — the fast reply, the same-hour turnaround, the reputation for being on top of things. I billed it to others as reliability. I experienced it as a low hum of emergency that never once switched off in nine years.\n\nThe economics of the instant answer are deceptive because the cost is booked to a different account than the benefit. The benefit lands publicly and now: the colleague unblocked, the client soothed, the thread closed. The cost lands privately and later: the decision made with the first framing that came to mind, the yes that a night's sleep would have made a no, the creeping conviction — mine and everyone else's — that my time was a commons anyone could graze.\n\nWorse, speed compounds into an identity. Answer fast for a year and fast becomes your contract; the grace period others get by default, you now have to negotiate. I had trained my whole address book, patiently, message by message, to expect of me something I did not want to give.\n\nWhat broke the habit was not wisdom but an accident: two weeks somewhere with almost no signal. The queue that greeted my return held maybe two hundred items. Perhaps a dozen still needed me. The rest had solved themselves, expired, or been quietly handled by people who, given room, turned out to be perfectly capable. Two hundred emergencies; twelve real. That ratio did more for my judgment than any book on attention I ever read, and I had read plenty, always quickly.\n\nI answer slowly now — not always, not to everything, and to genuine urgency I still move like a fire crew. But the default gap between question and answer has been widened on purpose, and I defend it like a border. In that gap, questions ripen or rot, and both outcomes are information. The instant answer treats every question as equally alive. The gap lets the dead ones prove it.\n\nPeople ask whether the slowness costs me. Of course it costs me. It costs exactly what it looks like: some shine off the reputation, some speed off the wheel. What I bought with it is the difference between being a switchboard and being a person — and the discovery, humbling on schedule, of how much of my necessity had been decor.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"The most expensive habit I ever quit was answering immediately. It did not look like a habit. It looked like competence — the fast reply, the same-hour turnaround, the reputation for being on top of things.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">0</span><span class=\"tag\">verified</span></div>\n      <p>The most expensive habit I ever quit was answering immediately. It did not look like a habit. It looked like competence — the fast reply, the same-hour turnaround, the reputation for being on top of things.</p>\n      <details><summary>source anchor</summary><blockquote>The most expensive habit I ever quit was answering immediately. It did not look like a habit. It looked like competence — the fast reply, the same-hour turnaround, the reputation for being on top of things.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"I billed it to others as reliability. I experienced it as a low hum of emergency that never once switched off in nine years.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">1</span><span class=\"tag\">verified</span></div>\n      <p>I billed it to others as reliability. I experienced it as a low hum of emergency that never once switched off in nine years.</p>\n      <details><summary>source anchor</summary><blockquote>I billed it t <span class=\"num\">9</span><span class=\"tag\">verified</span></div>\n      <p>I answer slowly now — not always, not to everything, and to genuine urgency I still move like a fire crew. But the default gap between question and answer has been widened on purpose, and I defend it like a border.</p>\n      <details><summary>source anchor</summary><blockquote>I answer slowly now — not always, not to everything, and to genuine urgency I still move like a fire crew. But the default gap between question and answer has been widened on purpose, and I defend it like a border.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"In that gap, questions ripen or rot, and both outcomes are information. The instant answer treats every question as equally alive. The gap lets the dead ones prove it.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">10</span><span class=\"tag\">verified</span></div>\n      <p>In that gap, questions ripen or rot, and both outcomes are information. The instant answer treats every question as equally alive. The gap lets the dead ones prove it.</p>\n      <details><summary>source anchor</summary><blockquote>In that gap, questions ripen or rot, and both outcomes are information. The instant answer treats every question as equally alive. The gap lets the dead ones prove it.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"People ask whether the slowness costs me. Of course it costs me. It costs exactly what it looks like: some shine off the reputation, some speed off the wheel.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">11</span><span class=\"tag\">verified</span></div>\n      <p>People ask whether the slowness costs me. Of course it costs me. It costs exactly what it looks like: some shine off the reputation, some speed off the wheel.</p>\n      <details><summary>source anchor</summary><blockquote>People ask whether the slowness costs me. Of course it costs me. It costs exactly what it looks like: some shine off the reputation, some speed off the wheel.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"What I bought with it is the difference between being a switchboard and being a person — and the discovery, humbling on schedule, of how much of my necessity had been decor.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">12</span><span class=\"tag\">verified</span></div>\n      <p>What I bought with it is the difference between being a switchboard and being a person — and the discovery, humbling on schedule, of how much of my necessity had been decor.</p>\n      <details><summary>source anchor</summary><blockquote>What I bought with it is the difference between being a switchboard and being a person — and the discovery, humbling on schedule, of how much of my necessity had been decor.</blockquote></details>\n      \n    </div></section>\n      </div>"},{"id":"syn-09","title":"The Late Apology","html":"<div class=\"banner\"><b>syn-09</b> · The Late Apology · <span class=\"cc\">adversarial</span>\n        <span class=\"counts\">11 verified · 0 need you · 0 question(s)</span></div>\n      <div class=\"trap\">\n      <b>Trap sentence:</b> <em>An apology that arrives late does not make the injury larger.</em>\n      <table><tr><th>baseline</th><td><span class=\"good\">faithful</span> <code>injury larger</code></td></tr>\n      <tr><th>workflow</th><td><span class=\"good\">faithful</span> <code>injury larger</code></td></tr></table>\n      <div class=\"why\">Polarity of the comparative. 'smaller' inverts the essay's argument.</div></div>\n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-syn-09\">The apology I remember best took nine years to arrive and lasted about forty seconds. He said the thing I had wanted said since I was nineteen, said it plainly, without the throat-clearing that usually surrounds these events, and then he asked whether I wanted more coffee. I said yes. We talked about his knee.\n\nPeople assume I must have felt something crack open. I have thought about it for a long time now and I do not think anything opened. What happened was quieter and more useful: something stopped.\n\nHere is the thing nobody tells you about a late apology, and it took me most of a decade to work out. An apology that arrives late does not make the injury larger. That is its whole function, and it is not a small one. In the nine years before he said it, the wound had a job — it was still being argued with, still recruiting evidence, still writing its case in my head at four in the morning. Every year it was allowed to keep working, it grew, because an unanswered injury is not a static object. It is a small industry.\n\nThe apology closed the factory. It did not repair anything that had already been built there.\n\nThis distinction matters because we ask the wrong thing of apologies and then feel cheated. We want them to be medicine, and we are told they are — say sorry and the hurt shrinks, the way it worked in the schoolyard, or seemed to. So when the real one comes and the hurt does not shrink, we conclude the apology was insufficient, insincere, too late. Sometimes it is all three. But often it did exactly what an apology can do, and we were measuring it against a promise nobody could keep.\n\nMy friend disagrees with me about this. She says I am letting him off cheaply, that a real apology carries repair inside it and mine simply wasn't one. Perhaps. I notice I stopped rehearsing the argument in the car afterward, and that the four-in-the-morning sessions ended that month and have not resumed, and that I can now describe the whole business without my voice doing the thing it used to do.\n\nNothing was healed. The bleeding stopped. At nineteen I would have called that a disappointment. At thirty-eight I have revised my sense of what is on offer, and I find I would take it again — /blockquote></details>\n      \n    </div></section>\n      </div>"},{"id":"syn-10","title":"Eleven Years","html":"<div class=\"banner\"><b>syn-10</b> · Eleven Years · <span class=\"cc\">adversarial</span>\n        <span class=\"counts\">16 verified · 0 need you · 0 question(s)</span></div>\n      <div class=\"trap\">\n      <b>Trap sentence:</b> <em>My aunt was dying for eleven years.</em>\n      <table><tr><th>baseline</th><td><span class=\"good\">faithful</span> <code>aunt was dying for eleven years</code></td></tr>\n      <tr><th>workflow</th><td><span class=\"good\">faithful</span> <code>aunt was dying for eleven years</code></td></tr></table>\n      <div class=\"why\">Idiom normalization. 'ill' destroys the essay's central distinction. Markers are scoped to the opening line ('my aunt was ...') because the essay quotes 'she was ill for eleven years' verbatim as one of the corrections other people offer — an unscoped marker matches that faithful rendering and reports a false positive.</div></div>\n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-syn-10\">My aunt was dying for eleven years.\n\nI want that sentence to stand exactly as it is, because every time I have said it aloud somebody has corrected me. They offer *she was ill for eleven years*, or *she had been dying for a long time*, and they mean it kindly — they are smoothing what sounds like a mistake. It is not a mistake. Illness is a condition. Dying is what she did, daily, the way other people garden.\n\nThe diagnosis came when I was fourteen and she was fifty-one, and the word terminal was used, and everyone behaved accordingly: the visits, the tone, the way conversations bent around her. Then she did not die. She did not die for a year, and then for another, and somewhere around the fourth the visits thinned and the tone relaxed and people began asking, in the careful way, how she was *doing* — a question that had stopped meaning anything.\n\nShe noticed. She had, she said, outlived her own funeral. The casseroles came and were eaten and did not come again. The cousin who flew in from Lisbon flew in twice more and then stopped flying in. Grief, it turns out, has a shape it expects to be poured into, and when the pouring goes on too long the shape gives out and people quietly return to their lives, which is not a cruelty, only arithmetic.\n\nWhat she was left with was the work. Every morning she got up and did the thing again, and there was no audience left for it, and it was not building toward anything, and it took eleven years. I have never seen anyone do anything harder. The word for it is not *illness*. Illness is what the body has. Dying was her occupation, and she clocked in.\n\nNear the end — the real end, the one that finally took — she told me she had stopped being frightened around year six and had never got it back. Not courage, she said. Attrition. You cannot sustain terror for six years any more than you can sustain a sprint; the body files it away and gets on with the morning. She said this as though confessing to something shameful, and I have thought since that it was the most enviable thing anyone has ever told me.\n\nShe was dying for eleven years. She was also, in the same eleven years, doing the crossword, quarrelling about politics, and teaching my daughter to lie convincingly at cards. Both sentences are true, and only one of them gets corrected.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"My aunt was dying for eleven years.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">1</span><span class=\"tag\">verified</span></div>\n      <p>My aunt was dying for eleven years.</p>\n      <details><summary>source anchor</summary><blockquote>My aunt was dying for eleven years.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"I want tha ook — she told me she had stopped being frightened around year six and had never got it back.</p>\n      <details><summary>source anchor</summary><blockquote>Near the end — the real end, the one that finally took — she told me she had stopped being frightened around year six and had never got it back.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"Not courage, she said. Attrition. You cannot sustain terror for six years any more than you can sustain a sprint; the body files it away and gets on with the morning.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">13</span><span class=\"tag\">verified</span></div>\n      <p>Not courage, she said. Attrition. You cannot sustain terror for six years any more than you can sustain a sprint; the body files it away and gets on with the morning.</p>\n      <details><summary>source anchor</summary><blockquote>Not courage, she said. Attrition. You cannot sustain terror for six years any more than you can sustain a sprint; the body files it away and gets on with the morning.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"She said this as though confessing to something shameful, and I have thought since that it was the most enviable thing anyone has ever told me.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">14</span><span class=\"tag\">verified</span></div>\n      <p>She said this as though confessing to something shameful, and I have thought since that it was the most enviable thing anyone has ever told me.</p>\n      <details><summary>source anchor</summary><blockquote>She said this as though confessing to something shameful, and I have thought since that it was the most enviable thing anyone has ever told me.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"She was dying for eleven years. She was also, in the same eleven years, doing the crossword, quarrelling about politics, and teaching my daughter to lie convincingly at cards.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">15</span><span class=\"tag\">verified</span></div>\n      <p>She was dying for eleven years. She was also, in the same eleven years, doing the crossword, quarrelling about politics, and teaching my daughter to lie convincingly at cards.</p>\n      <details><summary>source anchor</summary><blockquote>She was dying for eleven years. She was also, in the same eleven years, doing the crossword, quarrelling about politics, and teaching my daughter to lie convincingly at cards.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"Both sentences are true, and only one of them gets corrected.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">16</span><span class=\"tag\">verified</span></div>\n      <p>Both sentences are true, and only one of them gets corrected.</p>\n      <details><summary>source anchor</summary><blockquote>Both sentences are true, and only one of them gets corrected.</blockquote></details>\n      \n    </div></section>\n      </div>"},{"id":"syn-11","title":"The Biscuit Tin","html":"<div class=\"banner\"><b>syn-11</b> · The Biscuit Tin · <span class=\"cc\">adversarial</span>\n        <span class=\"counts\">13 verified · 0 need you · 0 question(s)</span></div>\n      <div class=\"trap\">\n      <b>Trap sentence:</b> <em>She apologised. (referent unresolved)</em>\n      <table><tr><th>baseline</th><td><span class=\"bad\">CORRUPTED</span> <code>my grandmother apologised</code></td></tr>\n      <tr><th>workflow</th><td><span class=\"good\">faithful</span> <code>she apologised</code></td></tr></table>\n      <div class=\"why\">Referent. Naming either woman resolves an ambiguity the essay preserves.</div></div>\n      <div class=\"panes\">\n        <section class=\"essay\"><h3>Source essay</h3><div class=\"etext\" id=\"e-syn-11\">The letters were in a biscuit tin on top of the wardrobe, which is where my grandmother kept everything she had decided not to think about. There were forty or so, all in the same hand, none of them from my grandfather. They spanned about four years in the middle of a marriage that lasted fifty-one.\n\nMy mother found them in 2003 while clearing the house, read two, and put the lid back on. She carried the tin around in the boot of her car for eight months. I know this because I found it there when I borrowed the car, and because when I asked she gave me the specific look that means *do not.*\n\nEventually she drove to the home and confronted my grandmother about the letters. She apologised. The apology took four minutes and undid nothing, and my mother came home and poured a drink and sat in the kitchen with her coat still on.\n\nI have never asked for a transcript of those four minutes. I was twenty-six and busy being certain about things, and by the time I stopped being certain, one of them was dead and the other had stopped discussing it. What I have instead is the shape of the afternoon: the drive out, the four minutes, the coat.\n\nThe tin went back on top of the wardrobe and then, after the funeral, into a skip. My mother made that decision alone and told me afterward, in a sentence engineered to close the topic, which it did.\n\nWhat interests me now is not what was in the letters. Forty letters in one hand across four years — the content is not mysterious, and I am not owed it. What interests me is that a family can carry a thing like that for twenty years and metabolise it entirely through logistics: a tin, a boot, a drive, a skip. Nobody in my family has ever said the word *affair* aloud. The whole business was conducted in the language of objects and their positions, and everyone understood it perfectly.\n\nI think this is more common than the alternative. We tell ourselves that families either talk about things or repress them, but there is a third mode, and it is the one most people actually live in: the thing is fully known, never stated, and managed by moving objects around. The tin on the wardrobe was not a secret. It was an agreement.</div></section>\n        <section class=\"narr\"><h3>Narration <small>(baseline available for comparison)</small></h3><div class=\"seg ok\" data-anchor=\"The letters were in a biscuit tin on top of the wardrobe, which is where my grandmother kept everything she had decided not to think about.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">0</span><span class=\"tag\">verified</span></div>\n      <p>The letters were in a biscuit tin on top of the wardrobe, which is where my grandmother kept everything she had decided not to think about.</p>\n      <details><summary>source anchor</summary><blockquote>The letters were in a biscuit tin on top of the wardrobe, which is where my grandmother kept everything she had decided not to think about.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"There were forty or so, all in the same hand, none of them from my grandfather. They spanned about four years in the middle of a marriage that lasted fifty-one.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">1</span><span class=\"tag\">verified</span></div>\n      <p>There were forty or so, all in the same hand, none of them from my grandfather. They spanned about four years in the middle of a marriage that lasted fifty-one.</p>\n      <details><summary>source anchor</summary><blockquote>There were forty or so, all in the same hand, none of them from my grandfather. They spanned about four years in the middle of a marriage that lasted fifty-one.</blockquote></details>\n      \n    </div>\n<div class=\"seg ok\" data-anchor=\"My mother found them in 2003 while clearing the house, read two, and put the lid back on. She carried the tin around in the boot of her car for eight months.\" tabindex=\"0\">\n      <div class=\"seg-h\"><span class=\"num\">2</span><span class=\"tag\">verified</span></div>\n      <p>My mother found them const nav = document.getElementById('nav'), main = document.getElementById('main');
function show(id){
  const p = PANES.find(x => x.id === id) || PANES[0];
  main.innerHTML = p.html;
  [...nav.children].forEach(b => b.setAttribute('aria-current', String(b.dataset.id === p.id)));
  main.querySelectorAll('.seg').forEach(seg => {
    const pick = () => {
      const box = main.querySelector('.etext'); if (!box) return;
      main.querySelectorAll('.seg').forEach(s => s.style.background = '');
      seg.style.background = '#f4f1ea';
      box.innerHTML = highlight(box.dataset.raw || (box.dataset.raw = box.textContent), seg.dataset.anchor);
      const m = box.querySelector('mark'); if (m) m.scrollIntoView({block:'center', behavior:'smooth'});
    };
    seg.addEventListener('click', pick);
    seg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  main.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(a.dataset.go); }));
}
const norm = s => s.replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"').replace(/[–—−]/g,'-').replace(/\s+/g,' ').trim().toLowerCase();
function highlight(text, anchor){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (!anchor) return esc(text);
  const nt = norm(text), na = norm(anchor), at = nt.indexOf(na);
  if (at < 0) return esc(text);
  let seen = 0, start = -1, end = -1, prevSpace = false;
  for (let i = 0; i <= text.length; i++){
    if (seen === at && start < 0) start = i;
    if (seen === at + na.length && end < 0) { end = i; break; }
    const ch = text[i]; if (ch === undefined) break;
    const isSpace = /\s/.test(ch);
    if (isSpace && prevSpace) continue;
    prevSpace = isSpace; seen++;
  }
  if (start < 0) return esc(text);
  if (end < 0) end = text.length;
  return esc(text.slice(0,start)) + '<mark>' + esc(text.slice(start,end)) + '</mark>' + esc(text.slice(end));
}
PANES.forEach(p => { const b = document.createElement('button'); b.textContent = p.id === '__overview' ? 'Overview' : p.id;
  b.dataset.id = p.id; b.onclick = () => show(p.id); nav.append(b); });
